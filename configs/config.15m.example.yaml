# Minimal 15m example preset for dry-runs/backtests or local overrides.
# The active default runtime config is `config.yaml`, which is already 15m.

symbols:
  - BTCUSDT

signals:
  timeframe_short: "15m"
  taker_confirmation:
    cvd_window_bars: 24
  trend_filter:
    ema_period: 200
    slope_window_bars: 24
    atr_period: 56
  regime:
    # Regime axis tracks entry axis on 15m for fast reaction in this regime.
    # Switch to "1h" only for an explicit legacy slower-regime experiment.
    timeframe: "15m"
